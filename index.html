<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ NEO-TRACKER | Умный планировщик</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Exo+2:wght@300;400;500;600;700&display=swap');

        :root {
            --primary: #00ff88;
            --primary-glow: rgba(0, 255, 136, 0.3);
            --secondary: #7700ff;
            --secondary-glow: rgba(119, 0, 255, 0.3);
            --accent: #ff00de;
            --accent-glow: rgba(255, 0, 222, 0.3);
            --dark: #0a0a14;
            --darker: #05050a;
            --panel-bg: rgba(20, 20, 40, 0.8);
            --text: #ffffff;
            --text-dim: #b0b0ff;
            --success: #00ff88;
            --warning: #ffcc00;
            --danger: #ff3366;
            --cyber-border: 1px solid rgba(0, 255, 136, 0.3);
            --cyber-glow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Exo 2', sans-serif;
            background: linear-gradient(135deg, #05050a, #0a0a14, #15152a);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Анимированный фон */
        .matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            opacity: 0.1;
            background: 
                radial-gradient(circle at 20% 30%, var(--primary-glow) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, var(--secondary-glow) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, var(--accent-glow) 0%, transparent 50%);
        }

        .grid-lines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 136, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 136, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* Заголовок */
        .main-header {
            text-align: center;
            padding: 30px 20px;
            position: relative;
            overflow: hidden;
        }

        .main-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
            margin-bottom: 10px;
            letter-spacing: 3px;
            animation: titleGlow 3s ease-in-out infinite alternate;
        }

        @keyframes titleGlow {
            0% { text-shadow: 0 0 20px rgba(0, 255, 136, 0.5); }
            100% { text-shadow: 0 0 40px rgba(119, 0, 255, 0.7), 0 0 60px rgba(255, 0, 222, 0.3); }
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 2px;
        }

        /* Контейнер */
        .dashboard {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            perspective: 1000px;
        }

        @media (max-width: 1300px) {
            .dashboard { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 768px) {
            .dashboard { grid-template-columns: 1fr; }
            .main-title { font-size: 2.5rem; }
        }

        /* Панели */
        .cyber-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: var(--cyber-border);
            border-radius: 20px;
            padding: 25px;
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: panelFloat 6s ease-in-out infinite;
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        @keyframes panelFloat {
            0%, 100% { transform: translateY(0) rotateX(1deg); }
            50% { transform: translateY(-10px) rotateX(-1deg); }
        }

        .cyber-panel:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.6),
                var(--cyber-glow),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .panel-header {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            position: relative;
        }

        .panel-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 20px;
            font-size: 24px;
            animation: iconPulse 2s ease-in-out infinite;
            box-shadow: 0 0 20px var(--primary-glow);
        }

        @keyframes iconPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .panel-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(90deg, var(--text), var(--primary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* Расписание */
        .schedule-inputs {
            display: grid;
            grid-template-columns: 1fr 2fr auto;
            gap: 15px;
            margin-bottom: 20px;
        }

        .time-picker {
            position: relative;
        }

        .time-picker input {
            width: 100%;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 10px;
            color: var(--text);
            font-family: 'Orbitron', monospace;
            font-size: 1.1rem;
            transition: all 0.3s;
        }

        .time-picker input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .task-input-wrapper {
            position: relative;
        }

        .ai-suggestion {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: rgba(20, 20, 40, 0.95);
            border: 1px solid var(--primary);
            border-radius: 10px;
            padding: 10px;
            margin-top: 5px;
            z-index: 100;
            display: none;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .schedule-list {
            max-height: 400px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .schedule-list::-webkit-scrollbar {
            width: 8px;
        }

        .schedule-list::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }

        .schedule-list::-webkit-scrollbar-thumb {
            background: linear-gradient(var(--primary), var(--secondary));
            border-radius: 10px;
        }

        .schedule-item {
            display: grid;
            grid-template-columns: 80px 1fr auto;
            gap: 15px;
            padding: 18px;
            margin-bottom: 15px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 15px;
            border-left: 4px solid var(--primary);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .schedule-item:hover {
            transform: translateX(5px);
            background: rgba(0, 0, 0, 0.6);
            border-left-color: var(--accent);
        }

        .time-badge {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            padding: 8px 12px;
            border-radius: 10px;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px var(--primary-glow);
        }

        /* Задачи */
        .task-input-area {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .task-input {
            flex: 1;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 15px;
            color: var(--text);
            font-size: 1.1rem;
            transition: all 0.3s;
        }

        .task-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .task-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .task-item {
            display: flex;
            align-items: center;
            padding: 18px;
            margin-bottom: 12px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
            position: relative;
        }

        .task-item:hover {
            transform: translateX(5px);
            border-color: var(--primary);
            background: rgba(0, 0, 0, 0.6);
        }

        .cyber-checkbox {
            width: 24px;
            height: 24px;
            margin-right: 15px;
            cursor: pointer;
            appearance: none;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid var(--primary);
            border-radius: 6px;
            position: relative;
            transition: all 0.3s;
        }

        .cyber-checkbox:checked {
            background: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .cyber-checkbox:checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--dark);
            font-weight: bold;
            font-size: 16px;
        }

        .task-text {
            flex: 1;
            font-size: 1.1rem;
            transition: all 0.3s;
        }

        .task-completed {
            text-decoration: line-through;
            opacity: 0.6;
            color: var(--text-dim);
        }

        /* Привычки с ИИ */
        .ai-habits {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .habit-card {
            background: linear-gradient(135deg, rgba(20, 20, 40, 0.8), rgba(40, 20, 60, 0.8));
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.4s;
            border: 1px solid rgba(0, 255, 136, 0.2);
        }

        .habit-card:hover {
            transform: translateY(-5px) scale(1.05);
            border-color: var(--primary);
            box-shadow: 0 10px 30px var(--primary-glow);
        }

        .habit-emoji {
            font-size: 2.5rem;
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .habit-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: var(--text);
        }

        .habit-progress {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .habit-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 4px;
            transition: width 0.5s ease;
            position: relative;
        }

        .habit-progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* Статистика и ИИ аналитика */
        .ai-insights {
            grid-column: 1 / -1;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(20, 20, 40, 0.8), rgba(40, 40, 80, 0.8));
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 10px 30px var(--primary-glow);
        }

        .stat-value {
            font-family: 'Orbitron', monospace;
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 10px 0;
        }

        .ai-message {
            background: linear-gradient(135deg, rgba(20, 20, 40, 0.9), rgba(40, 20, 60, 0.9));
            border-radius: 20px;
            padding: 25px;
            margin-top: 30px;
            border: 1px solid var(--primary);
            position: relative;
            overflow: hidden;
        }

        .ai-message::before {
            content: '🤖 AI ANALYSIS';
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 0.8rem;
            color: var(--primary);
            font-family: 'Orbitron', monospace;
        }

        /* Кнопки */
        .cyber-button {
            padding: 15px 30px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 15px;
            color: var(--dark);
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            letter-spacing: 1px;
        }

        .cyber-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px var(--primary-glow);
            letter-spacing: 2px;
        }

        .cyber-button:active {
            transform: translateY(0);
        }

        .cyber-button::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }

        .cyber-button:hover::after {
            left: 100%;
        }

        .button-danger {
            background: linear-gradient(135deg, var(--danger), #ff0066);
        }

        .button-success {
            background: linear-gradient(135deg, var(--success), #00cc66);
        }

        /* Уведомления */
        .notification-center {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 350px;
            z-index: 1000;
        }

        .cyber-notification {
            background: linear-gradient(135deg, rgba(20, 20, 40, 0.95), rgba(40, 40, 80, 0.95));
            border: 1px solid var(--primary);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            backdrop-filter: blur(10px);
            animation: slideInRight 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative;
            overflow: hidden;
            transform-origin: top right;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100%) rotateY(90deg);
            }
            to {
                opacity: 1;
                transform: translateX(0) rotateY(0);
            }
        }

        .notification-header {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .notification-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 20px;
        }

        .notification-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            color: var(--primary);
        }

        .notification-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .notification-close:hover {
            color: var(--danger);
            transform: rotate(90deg);
        }

        /* Мобильная навигация */
        .cyber-nav {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 40, 0.9);
            backdrop-filter: blur(20px);
            border: var(--cyber-border);
            border-radius: 50px;
            padding: 15px 30px;
            display: none;
            gap: 20px;
            z-index: 999;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        @media (max-width: 768px) {
            .cyber-nav { display: flex; }
            .dashboard { margin-bottom: 100px; }
        }

        .nav-button {
            width: 60px;
            height: 60px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: var(--text);
            cursor: pointer;
            transition: all 0.3s;
        }

        .nav-button.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--dark);
            box-shadow: 0 0 20px var(--primary-glow);
            transform: scale(1.1);
        }

        .nav-button:hover {
            transform: scale(1.1);
            border-color: var(--primary);
        }

        /* Анимации */
        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 var(--primary-glow); }
            70% { box-shadow: 0 0 0 10px transparent; }
            100% { box-shadow: 0 0 0 0 transparent; }
        }

        .glitch-text {
            position: relative;
            animation: glitch 3s infinite;
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        /* Прогресс бары */
        .progress-ring {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto;
        }

        .ring-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.1);
            stroke-width: 10;
        }

        .ring-progress {
            fill: none;
            stroke: url(#gradient);
            stroke-width: 10;
            stroke-linecap: round;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
            stroke-dasharray: 283;
            stroke-dashoffset: 283;
            transition: stroke-dashoffset 1s ease;
        }

        /* Анимация загрузки */
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            animation: scan 3s linear infinite;
            z-index: 1;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        /* Таймер дня */
        .day-timer {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(20, 20, 40, 0.8);
            border: var(--cyber-border);
            border-radius: 15px;
            padding: 15px;
            font-family: 'Orbitron', monospace;
            font-size: 1.2rem;
            z-index: 99;
            backdrop-filter: blur(10px);
        }

        .time-display {
            color: var(--primary);
            font-weight: 700;
            text-shadow: 0 0 10px var(--primary-glow);
        }
    </style>
</head>
<body>
    <!-- Анимированный фон -->
    <div class="matrix-bg"></div>
    <div class="grid-lines"></div>
    
    <!-- Таймер дня -->
    <div class="day-timer">
        <div class="time-display" id="current-time">00:00:00</div>
        <div style="font-size: 0.8rem; color: var(--text-dim);" id="day-progress">День: 0%</div>
    </div>

    <!-- Заголовок -->
    <header class="main-header">
        <h1 class="main-title glitch-text">⚡ NEO-TRACKER</h1>
        <p class="subtitle">ИСКУССТВЕННЫЙ ИНТЕЛЛЕКТ ДЛЯ ВАШЕЙ ПРОДУКТИВНОСТИ</p>
        <div class="scan-line"></div>
    </header>

    <!-- Уведомления -->
    <div class="notification-center" id="notification-center"></div>

    <!-- Основной контейнер -->
    <main class="dashboard">
        <!-- Панель 1: Расписание дня -->
        <div class="cyber-panel" id="schedule-panel">
            <div class="panel-header">
                <div class="panel-icon">⏰</div>
                <h2 class="panel-title">РАСПИСАНИЕ ДНЯ</h2>
            </div>
            
            <div class="schedule-inputs">
                <div class="time-picker">
                    <input type="time" id="schedule-time" value="09:00">
                </div>
                <div class="task-input-wrapper">
                    <input type="text" id="schedule-task" class="task-input" placeholder="Что планируете?" autocomplete="off">
                    <div class="ai-suggestion" id="ai-suggestion"></div>
                </div>
                <button class="cyber-button" onclick="addToSchedule()">
                    <i class="fas fa-plus"></i> ДОБАВИТЬ
                </button>
            </div>

            <button class="cyber-button button-success" onclick="autoGenerateSchedule()" style="width: 100%; margin-bottom: 20px;">
                <i class="fas fa-robot"></i> ИИ-РАСПИСАНИЕ
            </button>

            <div class="schedule-list" id="scheduleList">
                <!-- Расписание будет здесь -->
            </div>
        </div>

        <!-- Панель 2: Задачи дня -->
        <div class="cyber-panel" id="tasks-panel">
            <div class="panel-header">
                <div class="panel-icon">🎯</div>
                <h2 class="panel-title">ЗАДАЧИ ДНЯ</h2>
            </div>
            
            <div class="task-input-area">
                <input type="text" id="newTask" class="task-input" placeholder="Новая задача..." autocomplete="off">
                <button class="cyber-button" onclick="addTask()">
                    <i class="fas fa-bolt"></i>
                </button>
            </div>

            <button class="cyber-button button-success" onclick="generateTasksFromSchedule()" style="width: 100%; margin: 20px 0;">
                <i class="fas fa-sync-alt"></i> СИНХРОНИЗИРОВАТЬ С РАСПИСАНИЕМ
            </button>

            <div class="task-list" id="taskList">
                <!-- Задачи будут здесь -->
            </div>
        </div>

        <!-- Панель 3: ИИ-Привычки -->
        <div class="cyber-panel" id="habits-panel">
            <div class="panel-header">
                <div class="panel-icon">🧠</div>
                <h2 class="panel-title">ИИ-ПРИВЫЧКИ</h2>
            </div>
            
            <div class="ai-habits" id="aiHabits">
                <!-- ИИ-привычки будут здесь -->
            </div>

            <div style="text-align: center; margin-top: 20px;">
                <button class="cyber-button" onclick="analyzeAndSuggestHabits()">
                    <i class="fas fa-brain"></i> АНАЛИЗИРОВАТЬ МОИ ДНИ
                </button>
            </div>
        </div>

        <!-- Панель 4: Аналитика и статистика -->
        <div class="cyber-panel ai-insights">
            <div class="panel-header">
                <div class="panel-icon">📊</div>
                <h2 class="panel-title">ИИ-АНАЛИТИКА</h2>
            </div>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="productivity-score">85%</div>
                    <div class="stat-label">ЭФФЕКТИВНОСТЬ</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="streak-days">12</div>
                    <div class="stat-label">ДНЕЙ ПОДРЯД</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="tasks-completed">24</div>
                    <div class="stat-label">ВЫПОЛНЕНО ЗАДАЧ</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="ai-prediction">92%</div>
                    <div class="stat-label">ПРОГНОЗ ЗАВТРА</div>
                </div>
            </div>

            <div class="ai-message" id="ai-message">
                <!-- ИИ-анализ будет здесь -->
            </div>

            <div class="controls" style="margin-top: 30px; display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
                <button class="cyber-button button-success" onclick="exportData()">
                    <i class="fas fa-file-export"></i> ЭКСПОРТ
                </button>
                <button class="cyber-button" onclick="importData()">
                    <i class="fas fa-file-import"></i> ИМПОРТ
                </button>
                <button class="cyber-button button-danger" onclick="resetDay()">
                    <i class="fas fa-redo"></i> СБРОС ДНЯ
                </button>
                <button class="cyber-button" onclick="requestNotificationPermission()">
                    <i class="fas fa-bell"></i> УВЕДОМЛЕНИЯ
                </button>
            </div>
        </div>
    </main>

    <!-- Мобильная навигация -->
    <nav class="cyber-nav">
        <button class="nav-button active" onclick="showPanel('schedule')">⏰</button>
        <button class="nav-button" onclick="showPanel('tasks')">🎯</button>
        <button class="nav-button" onclick="showPanel('habits')">🧠</button>
        <button class="nav-button" onclick="showPanel('insights')">📊</button>
    </nav>

    <!-- SVG для прогресс-колец -->
    <svg style="display: none;">
        <defs>
            <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#7700ff;stop-opacity:1" />
            </linearGradient>
        </defs>
    </svg>

    <script>
        // ========== ИНИЦИАЛИЗАЦИЯ ==========
        const AI_HABITS = {
            'early_rise': { name: 'Ранний подъем', emoji: '🌅', category: 'утро' },
            'workout': { name: 'Тренировка', emoji: '💪', category: 'спорт' },
            'reading': { name: 'Чтение', emoji: '📚', category: 'развитие' },
            'planning': { name: 'Планирование', emoji: '📝', category: 'организация' },
            'learning': { name: 'Обучение', emoji: '🧠', category: 'развитие' },
            'water': { name: 'Вода 2л', emoji: '💧', category: 'здоровье' },
            'meditation': { name: 'Медитация', emoji: '🧘', category: 'ментальное' },
            'no_sugar': { name: 'Без сахара', emoji: '🚫🍬', category: 'питание' },
            'english': { name: 'Английский', emoji: '🇬🇧', category: 'языки' },
            'walk': { name: 'Прогулка', emoji: '🚶', category: 'активность' }
        };

        let schedule = JSON.parse(localStorage.getItem('neo_schedule')) || [];
        let tasks = JSON.parse(localStorage.getItem('neo_tasks')) || [];
        let habits = JSON.parse(localStorage.getItem('neo_habits')) || [];
        let analytics = JSON.parse(localStorage.getItem('neo_analytics')) || {
            dailyCompletion: [],
            habitPatterns: {},
            bestTime: null,
            productivityTrend: []
        };

        let notificationPermission = Notification.permission;
        const currentHour = new Date().getHours();

        // ========== ЗАГРУЗКА ==========
        document.addEventListener('DOMContentLoaded', function() {
            initApp();
            setupEventListeners();
            updateTime();
            checkForNotifications();
            
            // Запросить разрешение на уведомления
            if (notificationPermission === 'default') {
                setTimeout(requestNotificationPermission, 2000);
            }
            
            // Анализ привычек при загрузке
            setTimeout(() => {
                analyzeAndSuggestHabits();
                showAIMessage();
            }, 1000);
        });

        function initApp() {
            renderSchedule();
            renderTasks();
            updateAnalytics();
            
            // Если привычек нет, создать базовые
            if (habits.length === 0) {
                Object.keys(AI_HABITS).slice(0, 6).forEach((key, index) => {
                    habits.push({
                        id: Date.now() + index,
                        key: key,
                        name: AI_HABITS[key].name,
                        emoji: AI_HABITS[key].emoji,
                        progress: Math.floor(Math.random() * 100),
                        strength: 30 + Math.random() * 40,
                        autoDetected: true,
                        lastUpdated: new Date().toISOString()
                    });
                });
            }
            
            renderAIHabits();
        }

        // ========== РАСПИСАНИЕ ==========
        function addToSchedule() {
            const time = document.getElementById('schedule-time').value;
            const taskInput = document.getElementById('schedule-task');
            const task = taskInput.value.trim();
            
            if (!task) {
                showNotification('Введите задачу для расписания', 'warning');
                return;
            }
            
            const newItem = {
                id: Date.now(),
                time: time,
                task: task,
                completed: false,
                createdAt: new Date().toISOString(),
                category: detectCategory(task)
            };
            
            schedule.push(newItem);
            schedule.sort((a, b) => a.time.localeCompare(b.time));
            
            taskInput.value = '';
            renderSchedule();
            
            // Автоматически создать задачу
            if (shouldCreateTaskFromSchedule(task, time)) {
                createTaskFromSchedule(task, time, newItem.category);
            }
            
            saveAllData();
            updateAnalytics();
            showNotification(`Добавлено в расписание: ${time} - ${task}`);
            
            // Запланировать уведомление
            scheduleNotification(task, time);
        }

        function detectCategory(task) {
            const lower = task.toLowerCase();
            if (lower.includes('читать') || lower.includes('книг')) return 'reading';
            if (lower.includes('спорт') || lower.includes('тренир') || lower.includes('зарядк')) return 'workout';
            if (lower.includes('английск') || lower.includes('язык')) return 'english';
            if (lower.includes('работа') || lower.includes('проект')) return 'work';
            if (lower.includes('учеба') || lower.includes('обучен')) return 'learning';
            if (lower.includes('план') || lower.includes('расписан')) return 'planning';
            return 'other';
        }

        function shouldCreateTaskFromSchedule(task, time) {
            const hour = parseInt(time.split(':')[0]);
            return hour >= 6 && hour <= 22 && !tasks.some(t => t.text === task);
        }

        function createTaskFromSchedule(task, time, category) {
            tasks.push({
                id: Date.now(),
                text: task,
                completed: false,
                fromSchedule: true,
                scheduleTime: time,
                category: category,
                createdAt: new Date().toISOString()
            });
            renderTasks();
            showNotification(`Задача создана: ${task}`, 'success');
        }

        function renderSchedule() {
            const container = document.getElementById('scheduleList');
            container.innerHTML = '';
            
            if (schedule.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: var(--text-dim);">
                        <i class="fas fa-clock" style="font-size: 48px; margin-bottom: 20px; opacity: 0.5;"></i>
                        <h3 style="margin-bottom: 10px;">Расписание пусто</h3>
                        <p>Добавьте первый пункт или используйте ИИ-расписание</p>
                    </div>
                `;
                return;
            }
            
            schedule.forEach(item => {
                const now = new Date();
                const [hours, minutes] = item.time.split(':').map(Number);
                const itemTime = new Date();
                itemTime.setHours(hours, minutes, 0, 0);
                
                let status = '';
                if (item.completed) status = 'completed';
                else if (now > itemTime) status = 'overdue';
                else if (Math.abs(now - itemTime) < 30 * 60 * 1000) status = 'current';
                
                const div = document.createElement('div');
                div.className = `schedule-item ${status}`;
                div.innerHTML = `
                    <div class="time-badge">${item.time}</div>
                    <div style="display: flex; align-items: center;">
                        <input type="checkbox" class="cyber-checkbox" ${item.completed ? 'checked' : ''}
                               onclick="toggleScheduleItem(${item.id})">
                        <span style="margin-left: 15px; ${item.completed ? 'text-decoration: line-through; opacity: 0.6;' : ''}">
                            ${item.task}
                        </span>
                    </div>
                    <button class="delete-btn" onclick="deleteScheduleItem(${item.id})" style="background: none; border: none; color: var(--danger); cursor: pointer;">
                        <i class="fas fa-times"></i>
                    </button>
                `;
                container.appendChild(div);
            });
        }

        function toggleScheduleItem(id) {
            const item = schedule.find(i => i.id === id);
            if (item) {
                item.completed = !item.completed;
                renderSchedule();
                saveAllData();
                updateAnalytics();
                
                // Обновить связанную задачу
                const relatedTask = tasks.find(t => t.text === item.task);
                if (relatedTask) {
                    relatedTask.completed = item.completed;
                    renderTasks();
                }
                
                showNotification(item.completed ? 'Выполнено! 👍' : 'Возвращено в работу', 
                               item.completed ? 'success' : 'info');
            }
        }

        function deleteScheduleItem(id) {
            schedule = schedule.filter(i => i.id !== id);
            renderSchedule();
            saveAllData();
            showNotification('Пункт удален из расписания', 'info');
        }

        function autoGenerateSchedule() {
            const templates = {
                morning: [
                    { time: '07:00', task: 'Пробуждение и утренняя медитация' },
                    { time: '07:30', task: 'Зарядка и контрастный душ' },
                    { time: '08:00', task: 'Полезный завтрак' },
                    { time: '09:00', task: 'Планирование дня' }
                ],
                workday: [
                    { time: '10:00', task: 'Работа над главным проектом' },
                    { time: '12:00', task: 'Обед и короткий отдых' },
                    { time: '13:00', task: 'Продолжение работы' },
                    { time: '15:00', task: 'Изучение нового материала' },
                    { time: '17:00', task: 'Подведение рабочих итогов' }
                ],
                evening: [
                    { time: '18:00', task: 'Спорт или активный отдых' },
                    { time: '19:00', task: 'Ужин' },
                    { time: '20:00', task: 'Чтение книги' },
                    { time: '21:00', task: 'Английский язык' },
                    { time: '22:00', task: 'Подготовка ко сну' }
                ]
            };
            
            schedule = [];
            [...templates.morning, ...templates.workday, ...templates.evening].forEach((item, index) => {
                schedule.push({
                    id: Date.now() + index,
                    time: item.time,
                    task: item.task,
                    completed: false,
                    createdAt: new Date().toISOString(),
                    category: detectCategory(item.task)
                });
            });
            
            renderSchedule();
            saveAllData();
            showNotification('ИИ создал оптимальное расписание на день! 🚀', 'success');
        }

        // ========== ЗАДАЧИ ==========
        function addTask() {
            const input = document.getElementById('newTask');
            const text = input.value.trim();
            
            if (!text) {
                showNotification('Введите задачу', 'warning');
                return;
            }
            
            const task = {
                id: Date.now(),
                text: text,
                completed: false,
                createdAt: new Date().toISOString(),
                category: detectCategory(text)
            };
            
            tasks.push(task);
            input.value = '';
            renderTasks();
            saveAllData();
            updateAnalytics();
            
            // Анализ на привычки
            analyzeTaskForHabits(text);
            
            showNotification('Задача добавлена! ⚡', 'success');
        }

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                renderTasks();
                saveAllData();
                updateAnalytics();
                
                // Обновить аналитику привычек
                if (task.completed) {
                    updateHabitStrength(task.category);
                }
                
                showNotification(task.completed ? 'Отличная работа! 🎉' : 'Возвращено в работу', 
                               task.completed ? 'success' : 'info');
            }
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            renderTasks();
            saveAllData();
            showNotification('Задача удалена', 'info');
        }

        function renderTasks() {
            const container = document.getElementById('taskList');
            container.innerHTML = '';
            
            if (tasks.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 30px; color: var(--text-dim);">
                        <i class="fas fa-tasks" style="font-size: 48px; margin-bottom: 20px; opacity: 0.5;"></i>
                        <h3 style="margin-bottom: 10px;">Нет задач</h3>
                        <p>Добавьте первую задачу или синхронизируйте с расписанием</p>
                    </div>
                `;
                return;
            }
            
            // Сортировка: сначала невыполненные, новые сверху
            const sortedTasks = [...tasks].sort((a, b) => {
                if (a.completed !== b.completed) return a.completed ? 1 : -1;
                return new Date(b.createdAt) - new Date(a.createdAt);
            });
            
            sortedTasks.forEach(task => {
                const div = document.createElement('div');
                div.className = 'task-item';
                div.innerHTML = `
                    <input type="checkbox" class="cyber-checkbox" ${task.completed ? 'checked' : ''}
                           onclick="toggleTask(${task.id})">
                    <span class="task-text ${task.completed ? 'task-completed' : ''}">
                        ${task.fromSchedule ? '<i class="fas fa-clock" style="margin-right: 10px; color: var(--primary);"></i>' : ''}
                        ${task.text}
                        ${task.category ? `<span style="font-size: 0.8rem; background: rgba(0,255,136,0.2); padding: 2px 8px; border-radius: 10px; margin-left: 10px;">${getCategoryEmoji(task.category)}</span>` : ''}
                    </span>
                    <button onclick="deleteTask(${task.id})" style="background: none; border: none; color: var(--danger); cursor: pointer;">
                        <i class="fas fa-trash"></i>
                    </button>
                `;
                container.appendChild(div);
            });
        }

        function generateTasksFromSchedule() {
            const uncompleted = schedule.filter(s => !s.completed);
            let added = 0;
            
            uncompleted.forEach(item => {
                if (!tasks.some(t => t.text === item.task)) {
                    tasks.push({
                        id: Date.now() + Math.random(),
                        text: item.task,
                        completed: false,
                        fromSchedule: true,
                        scheduleTime: item.time,
                        category: item.category,
                        createdAt: new Date().toISOString()
                    });
                    added++;
                }
            });
            
            if (added > 0) {
                renderTasks();
                saveAllData();
                showNotification(`Создано ${added} задач из расписания! 📋`, 'success');
            } else {
                showNotification('Все задачи уже синхронизированы', 'info');
            }
        }

        // ========== ИИ-ПРИВЫЧКИ ==========
        function analyzeAndSuggestHabits() {
            // Анализ выполненных задач
            const completedTasks = tasks.filter(t => t.completed);
            const taskCategories = completedTasks.reduce((acc, task) => {
                acc[task.category] = (acc[task.category] || 0) + 1;
                return acc;
            }, {});
            
            // Анализ расписания
            const schedulePatterns = schedule.reduce((acc, item) => {
                if (item.category && item.category !== 'other') {
                    acc[item.category] = (acc[item.category] || 0) + 1;
                }
                return acc;
            }, {});
            
            // Определение сильных сторон
            const allPatterns = { ...taskCategories, ...schedulePatterns };
            const strongCategories = Object.entries(allPatterns)
                .filter(([_, count]) => count >= 2)
                .map(([category]) => category);
            
            // Создание/обновление привычек
            strongCategories.forEach(category => {
                const habitKey = category;
                const habitInfo = Object.entries(AI_HABITS).find(([_, info]) => info.category === category);
                
                if (habitInfo) {
                    const [key, info] = habitInfo;
                    const existingHabit = habits.find(h => h.key === key);
                    
                    if (existingHabit) {
                        // Увеличить силу привычки
                        existingHabit.strength = Math.min(100, existingHabit.strength + 10);
                        existingHabit.progress = Math.min(100, existingHabit.progress + 15);
                        existingHabit.lastUpdated = new Date().toISOString();
                    } else {
                        // Создать новую привычку
                        habits.push({
                            id: Date.now(),
                            key: key,
                            name: info.name,
                            emoji: info.emoji,
                            progress: 40,
                            strength: 50,
                            autoDetected: true,
                            lastUpdated: new Date().toISOString()
                        });
                    }
                }
            });
            
            // Уменьшить силу неиспользуемых привычек
            habits.forEach(habit => {
                if (!strongCategories.some(cat => {
                    const habitInfo = AI_HABITS[habit.key];
                    return habitInfo && habitInfo.category === cat;
                })) {
                    habit.strength = Math.max(10, habit.strength - 5);
                    habit.progress = Math.max(0, habit.progress - 10);
                }
            });
            
            renderAIHabits();
            saveAllData();
            
            showNotification('ИИ проанализировал ваши действия! 🧠', 'success');
        }

        function analyzeTaskForHabits(taskText) {
            const lower = taskText.toLowerCase();
            const detectedHabits = [];
            
            Object.entries(AI_HABITS).forEach(([key, info]) => {
                const keywords = {
                    'early_rise': ['утро', 'рано', 'проснуться', 'подъем'],
                    'workout': ['спорт', 'тренир', 'зарядк', 'бег', 'фитнес'],
                    'reading': ['читать', 'книг', 'литератур'],
                    'learning': ['учить', 'обучен', 'курс', 'изуч'],
                    'english': ['английск', 'язык', 'слова'],
                    'water': ['вода', 'пить', 'гидрат'],
                    'meditation': ['медитац', 'дыхание', 'релакс'],
                    'walk': ['прогул', 'гуля', 'свежий воздух']
                };
                
                if (keywords[key] && keywords[key].some(word => lower.includes(word))) {
                    detectedHabits.push(key);
                }
            });
            
            detectedHabits.forEach(key => {
                const habit = habits.find(h => h.key === key);
                if (habit) {
                    habit.progress = Math.min(100, habit.progress + 5);
                    habit.lastUpdated = new Date().toISOString();
                }
            });
            
            if (detectedHabits.length > 0) {
                setTimeout(renderAIHabits, 1000);
            }
        }

        function updateHabitStrength(category) {
            const habit = habits.find(h => {
                const info = AI_HABITS[h.key];
                return info && info.category === category;
            });
            
            if (habit) {
                habit.strength = Math.min(100, habit.strength + 3);
                habit.progress = Math.min(100, habit.progress + 8);
                habit.lastUpdated = new Date().toISOString();
                renderAIHabits();
            }
        }

        function renderAIHabits() {
            const container = document.getElementById('aiHabits');
            container.innerHTML = '';
            
            // Сортировка по силе привычки
            const sortedHabits = [...habits].sort((a, b) => b.strength - a.strength);
            
            sortedHabits.forEach(habit => {
                const habitInfo = AI_HABITS[habit.key];
                if (!habitInfo) return;
                
                const card = document.createElement('div');
                card.className = 'habit-card';
                card.innerHTML = `
                    <div class="habit-emoji">${habit.emoji}</div>
                    <div class="habit-name">${habit.name}</div>
                    <div class="habit-progress">
                        <div class="habit-progress-bar" style="width: ${habit.progress}%"></div>
                    </div>
                    <div style="display: flex; justify-content: space-between; font-size: 0.9rem; margin-top: 10px;">
                        <span style="color: var(--text-dim);">Сила: ${Math.round(habit.strength)}%</span>
                        <span style="color: var(--primary);">${habit.progress}%</span>
                    </div>
                    ${habit.autoDetected ? '<div style="font-size: 0.7rem; color: var(--primary); margin-top: 5px;"><i class="fas fa-robot"></i> ИИ-рекомендация</div>' : ''}
                `;
                
                card.onclick = () => {
                    habit.progress = Math.min(100, habit.progress + 10);
                    habit.strength = Math.min(100, habit.strength + 5);
                    renderAIHabits();
                    saveAllData();
                    showNotification(`Привычка "${habit.name}" укреплена! 💪`, 'success');
                };
                
                container.appendChild(card);
            });
        }

        // ========== АНАЛИТИКА ==========
        function updateAnalytics() {
            // Продуктивность
            const completedTasks = tasks.filter(t => t.completed).length;
            const totalTasks = tasks.length;
            const productivity = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;
            
            // Дни подряд
            const today = new Date().toDateString();
            const yesterday = new Date(Date.now() - 86400000).toDateString();
            const streak = analytics.dailyCompletion || [];
            const streakDays = streak.length;
            
            // Прогноз на завтра
            const prediction = calculatePrediction();
            
            document.getElementById('productivity-score').textContent = `${productivity}%`;
            document.getElementById('streak-days').textContent = streakDays;
            document.getElementById('tasks-completed').textContent = completedTasks;
            document.getElementById('ai-prediction').textContent = `${prediction}%`;
            
            // Сохранить аналитику
            if (completedTasks > 0) {
                if (!analytics.dailyCompletion.includes(today)) {
                    analytics.dailyCompletion.push(today);
                }
                
                // Обновить паттерны
                tasks.forEach(task => {
                    if (task.completed && task.category) {
                        analytics.habitPatterns[task.category] = (analytics.habitPatterns[task.category] || 0) + 1;
                    }
                });
                
                saveAnalytics();
            }
        }

        function calculatePrediction() {
            const recentTasks = tasks.filter(t => {
                const taskDate = new Date(t.createdAt);
                const daysAgo = (Date.now() - taskDate) / (1000 * 60 * 60 * 24);
                return daysAgo <= 7 && t.completed;
            });
            
            const completionRate = recentTasks.length / 7;
            const avgProductivity = Math.min(95, Math.max(60, completionRate * 100 + 20));
            
            return Math.round(avgProductivity + (Math.random() * 10 - 5));
        }

        function showAIMessage() {
            const container = document.getElementById('ai-message');
            const messages = [
                "🚀 Анализ показал: ваша продуктивность растет! Продолжайте в том же духе.",
                "📊 ИИ заметил: вы лучше всего работаете утром. Используйте это время для сложных задач.",
                "💡 Совет от ИИ: добавьте 15-минутные перерывы каждые 90 минут работы.",
                "🎯 Обнаружена сильная привычка: регулярное чтение. Отличная работа!",
                "⚡ Энергия на максимуме! Сегодня идеальный день для спортивных достижений.",
                "🧠 Инсайт: ваша эффективность повышается когда задачи связаны с расписанием.",
                "🌟 Рекомендация: попробуйте технику Pomodoro для еще большей фокусировки."
            ];
            
            const randomMessage = messages[Math.floor(Math.random() * messages.length)];
            
            container.innerHTML = `
                <div style="display: flex; align-items: start; gap: 15px;">
                    <div style="font-size: 2rem;">🤖</div>
                    <div>
                        <h3 style="color: var(--primary); margin-bottom: 10px;">ИИ-АНАЛИЗ ВАШЕЙ ПРОДУКТИВНОСТИ</h3>
                        <p style="line-height: 1.6; margin-bottom: 15px;">${randomMessage}</p>
                        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                            <span style="background: rgba(0,255,136,0.2); padding: 5px 10px; border-radius: 10px; font-size: 0.9rem;">
                                <i class="fas fa-chart-line"></i> Тренд: ↑ 15%
                            </span>
                            <span style="background: rgba(119,0,255,0.2); padding: 5px 10px; border-radius: 10px; font-size: 0.9rem;">
                                <i class="fas fa-bolt"></i> Энергия: 85%
                            </span>
                            <span style="background: rgba(255,0,222,0.2); padding: 5px 10px; border-radius: 10px; font-size: 0.9rem;">
                                <i class="fas fa-brain"></i> Фокус: 92%
                            </span>
                        </div>
                    </div>
                </div>
            `;
        }

        // ========== УВЕДОМЛЕНИЯ ==========
        function requestNotificationPermission() {
            if (Notification.permission === 'default') {
                Notification.requestPermission().then(permission => {
                    notificationPermission = permission;
                    if (permission === 'granted') {
                        showNotification('Уведомления включены! 🔔', 'success');
                        scheduleNextNotification();
                    }
                });
            } else if (Notification.permission === 'denied') {
                showNotification('Разрешите уведомления в настройках браузера', 'warning');
            }
        }

        function scheduleNotification(task, time) {
            if (Notification.permission !== 'granted') return;
            
            const [hours, minutes] = time.split(':').map(Number);
            const now = new Date();
            const notificationTime = new Date();
            notificationTime.setHours(hours, minutes, 0, 0);
            
            // Если время уже прошло, запланировать на завтра
            if (notificationTime < now) {
                notificationTime.setDate(notificationTime.getDate() + 1);
            }
            
            const timeout = notificationTime.getTime() - now.getTime();
            
            if (timeout > 0 && timeout < 24 * 60 * 60 * 1000) {
                setTimeout(() => {
                    showBrowserNotification(`⏰ Время для: ${task}`, `По расписанию: ${time}`);
                }, timeout);
            }
        }

        function showBrowserNotification(title, body) {
            if (Notification.permission === 'granted') {
                new Notification(title, {
                    body: body,
                    icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="%2300ff88"/><text x="50" y="55" text-anchor="middle" font-size="40">⚡</text></svg>',
                    badge: 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/svgs/solid/bolt.svg',
                    tag: 'neo-tracker',
                    renotify: true,
                    vibrate: [200, 100, 200]
                });
                
                // Показать также встроенное уведомление
                showNotification(title + ': ' + body, 'info');
            }
        }

        function checkForNotifications() {
            // Ежечасные проверки
            setInterval(() => {
                const now = new Date();
                const hour = now.getHours();
                
                // Утреннее напоминание
                if (hour === 8) {
                    showNotification('Доброе утро! Пора планировать день ☀️', 'info');
                }
                
                // Обеденное напоминание
                if (hour === 13) {
                    showNotification('Время обеда и отдыха! 🍽️', 'info');
                }
                
                // Вечерний обзор
                if (hour === 20) {
                    showNotification('Подведите итоги дня 📊', 'info');
                }
                
                // Проверить текущие задачи по расписанию
                schedule.forEach(item => {
                    if (!item.completed) {
                        const [h, m] = item.time.split(':').map(Number);
                        if (hour === h && now.getMinutes() === m) {
                            showNotification(`Сейчас по расписанию: ${item.task}`, 'warning');
                        }
                    }
                });
                
            }, 60000); // Каждую минуту
        }

        function scheduleNextNotification() {
            if (Notification.permission !== 'granted') return;
            
            // Напоминание каждые 2 часа
            setInterval(() => {
                const uncompleted = tasks.filter(t => !t.completed);
                if (uncompleted.length > 0) {
                    const randomTask = uncompleted[Math.floor(Math.random() * uncompleted.length)];
                    showBrowserNotification('⏰ Напоминание о задаче', `Не забывайте про: ${randomTask.text}`);
                }
            }, 2 * 60 * 60 * 1000);
        }

        // ========== УПРАВЛЕНИЕ ДАННЫМИ ==========
        function saveAllData() {
            localStorage.setItem('neo_schedule', JSON.stringify(schedule));
            localStorage.setItem('neo_tasks', JSON.stringify(tasks));
            localStorage.setItem('neo_habits', JSON.stringify(habits));
        }

        function saveAnalytics() {
            localStorage.setItem('neo_analytics', JSON.stringify(analytics));
        }

        function exportData() {
            const data = {
                schedule: schedule,
                tasks: tasks,
                habits: habits,
                analytics: analytics,
                exportedAt: new Date().toISOString(),
                version: '2.0'
            };
            
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `neo-tracker-${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showNotification('Данные экспортированы! 💾', 'success');
        }

        function importData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            
            input.onchange = function(event) {
                const file = event.target.files[0];
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    try {
                        const data = JSON.parse(e.target.result);
                        
                        if (confirm('Заменить текущие данные? Это действие нельзя отменить.')) {
                            schedule = data.schedule || [];
                            tasks = data.tasks || [];
                            habits = data.habits || [];
                            analytics = data.analytics || {};
                            
                            renderSchedule();
                            renderTasks();
                            renderAIHabits();
                            updateAnalytics();
                            saveAllData();
                            
                            showNotification('Данные успешно импортированы! 🎉', 'success');
                        }
                    } catch (error) {
                        showNotification('Ошибка при чтении файла!', 'danger');
                    }
                };
                
                reader.readAsText(file);
            };
            
            input.click();
        }

        function resetDay() {
            if (confirm('Сбросить все задачи и расписание на сегодня? Невыполненные задачи будут удалены.')) {
                const today = new Date().toDateString();
                
                // Оставить только задачи не сегодняшнего дня
                tasks = tasks.filter(task => {
                    const taskDate = new Date(task.createdAt).toDateString();
                    return taskDate !== today || task.completed;
                });
                
                // Оставить только расписание не сегодняшнего дня
                schedule = schedule.filter(item => {
                    const itemDate = new Date(item.createdAt).toDateString();
                    return itemDate !== today || item.completed;
                });
                
                renderSchedule();
                renderTasks();
                saveAllData();
                
                showNotification('День сброшен! Начинаем с чистого листа 🧹', 'info');
            }
        }

        // ========== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ==========
        function showNotification(message, type = 'info') {
            const center = document.getElementById('notification-center');
            const notification = document.createElement('div');
            notification.className = 'cyber-notification';
            
            const icons = {
                success: '✅',
                warning: '⚠️',
                danger: '❌',
                info: 'ℹ️'
            };
            
            notification.innerHTML = `
                <div class="notification-header">
                    <div class="notification-icon">${icons[type] || '⚡'}</div>
                    <div class="notification-title">${type.toUpperCase()}</div>
                    <button class="notification-close" onclick="this.parentElement.parentElement.remove()">×</button>
                </div>
                <div class="notification-body">${message}</div>
            `;
            
            center.insertBefore(notification, center.firstChild);
            
            // Автоматическое удаление через 5 секунд
            setTimeout(() => {
                if (notification.parentElement) {
                    notification.style.animation = 'slideInRight 0.5s reverse';
                    setTimeout(() => notification.remove(), 500);
                }
            }, 5000);
        }

        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('ru-RU', { hour12: false });
            const dayProgress = (now.getHours() * 60 + now.getMinutes()) / (24 * 60) * 100;
            
            document.getElementById('current-time').textContent = timeString;
            document.getElementById('day-progress').textContent = `День: ${Math.round(dayProgress)}%`;
            
            setTimeout(updateTime, 1000);
        }

        function getCategoryEmoji(category) {
            const emojis = {
                'reading': '📚',
                'workout': '💪',
                'english': '🇬🇧',
                'work': '💼',
                'learning': '🧠',
                'planning': '📝',
                'other': '🔹'
            };
            return emojis[category] || '🔹';
        }

        function showPanel(panelName) {
            // Обновить активную кнопку
            document.querySelectorAll('.nav-button').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // Прокрутить к панели
            const panel = document.getElementById(panelName + '-panel');
            if (panel) {
                panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
                panel.classList.add('pulse');
                setTimeout(() => panel.classList.remove('pulse'), 1000);
            }
        }

        function setupEventListeners() {
            // Автодополнение задач
            const taskInput = document.getElementById('newTask');
            const scheduleInput = document.getElementById('schedule-task');
            
            [taskInput, scheduleInput].forEach(input => {
                input.addEventListener('input', function() {
                    const value = this.value.toLowerCase();
                    if (value.length > 2) {
                        const suggestions = Object.values(AI_HABITS)
                            .map(h => h.name)
                            .filter(name => name.toLowerCase().includes(value))
                            .slice(0, 3);
                        
                        if (suggestions.length > 0) {
                            const suggestionDiv = document.getElementById('ai-suggestion');
                            suggestionDiv.innerHTML = suggestions.map(s => 
                                `<div class="suggestion-item" onclick="document.getElementById('${this.id}').value = '${s}'; suggestionDiv.style.display = 'none'">${s}</div>`
                            ).join('');
                            suggestionDiv.style.display = 'block';
                        }
                    }
                });
                
                input.addEventListener('blur', () => {
                    setTimeout(() => {
                        const suggestionDiv = document.getElementById('ai-suggestion');
                        if (suggestionDiv) suggestionDiv.style.display = 'none';
                    }, 200);
                });
            });
            
            // Горячие клавиши
            document.addEventListener('keydown', function(e) {
                // Ctrl+Enter - добавить задачу
                if (e.ctrlKey && e.key === 'Enter') {
                    const focused = document.activeElement;
                    if (focused.id === 'newTask') addTask();
                    if (focused.id === 'schedule-task') addToSchedule();
                }
                
                // Esc - закрыть все
                if (e.key === 'Escape') {
                    document.querySelectorAll('.ai-suggestion, .cyber-notification')
                        .forEach(el => el.style.display = 'none');
                }
            });
            
            // Вибрация при кликах (для мобильных)
            if ('vibrate' in navigator) {
                document.querySelectorAll('button, .cyber-checkbox, .habit-card').forEach(el => {
                    el.addEventListener('click', () => {
                        navigator.vibrate(10);
                    });
                });
            }
        }

        // Инициализация при загрузке
        window.addEventListener('load', () => {
            document.body.style.opacity = '0';
            document.body.style.transition = 'opacity 0.5s ease';
            
            setTimeout(() => {
                document.body.style.opacity = '1';
                showNotification('NEO-TRACKER загружен! Готов к работе ⚡', 'success');
            }, 100);
        });
    </script>
